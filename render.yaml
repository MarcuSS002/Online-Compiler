services:
  - type: web
    name: online-compiler-backend
    env: node
    plan: free
    root: ./backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: postgres
          property: connectionString
      - key: PORT
        value: 3000
  - type: postgres
    name: postgres
    plan: free
    ipAllowList: []
